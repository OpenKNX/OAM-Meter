build_type                   = debug
;board_build.filesystem_size  = 2080768 ; 2 MiB = 0.5 MiB mehr Luft
debug_build_flags            = -Og -g2 -ggdb2
debug_server =
  /usr/local/bin/JLinkGDBServerCL
  -singlerun
  -if
  SWD
  -select
  USB
  -port
  2331
  -device
  RP2350_M33_0
