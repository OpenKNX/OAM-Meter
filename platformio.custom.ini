build_flags =
  ${RP2040_releases.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_releases.build_flags}
  ${RP2040_EXCHANGE_2MB.build_flags}
  -D DEVICE_REG2_PIPICO_V1_DD_METER 
  -D DEVICE_DISPLAY_MODULE ;Enable the display module
  -D DEVICE_DISPLAY_MODULE_SSD1315
  ;-D DEVICE_RTC_MODULE ;Enable the RTC module
  ;-D EXTERNAL_FLASH_MODULE ;Enable the external flash module
  ;-D NO_GLOBAL_EXT_LITTLEFS ;Disable the global external LittleFS

[env:release_OKNXHW_REG2_PIPICO_W_V1]
extends = RP2040_releases, RP2040_custom, RP2040_EXCHANGE_2MB
build_flags =
  ${RP2040_releases.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_releases.build_flags}
  ${RP2040_EXCHANGE_2MB.build_flags}
  -D OPENKNX_MAX_MODULES=15
  -D DEVICE_REG2_PIPICO_W_V1_DD_METER
  -D DEVICE_DISPLAY_MODULE  ;Enable the display module
  ;-D OKNXHW_REG2_DEVICE_RTC ;Enable the RTC module
  ;-D DEMO_WIDGET_CMD_TESTS ;Enable the demo widget commands tests
  ;-D DEVICE_RTC_MODULE    ;Enable the RTC module
  -D EXTERNAL_FLASH_MODULE ;Enable the external flash module
  -D NO_GLOBAL_EXT_LITTLEFS ;Disable the global external LittleFS
  -D OPENKNX_RUNTIME_STAT   ;Enable the runtime statistics
  -D OPENKNX_RUNTIME_STAT_BUCKETN=16 ;Set the number of buckets
  "-D OPENKNX_RUNTIME_STAT_BUCKETS=50, 100, 200, 400, 800, 3200, 8000, 16000, 24000, 28000, 32000, 36000, 40000, 45000, 50000" ;Set the buckets values

